[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyirena-ai"
version = "0.0.1"
description = "AI-driven SAXS/USAXS fitting on top of pyirena."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jan Ilavsky", email = "ilavsky@anl.gov"}
]
maintainers = [
    {name = "Jan Ilavsky", email = "ilavsky@anl.gov"}
]
keywords = [
    "SAXS", "USAXS", "small-angle scattering", "unified fit",
    "Beaucage", "AI", "LLM", "agent", "tool-use",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "pyirena>=0.8.2",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.0.0",
]
keyring = [
    "keyring>=24.0",
]
gui = [
    "gradio>=4.44",
    "Pillow>=10.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "build",
    "twine",
]
all = [
    "pyirena-ai[anthropic]",
    "pyirena-ai[openai]",
    "pyirena-ai[keyring]",
    "pyirena-ai[gui]",
]

[project.urls]
Homepage      = "https://github.com/jilavsky/pyirena-ai"
Documentation = "https://github.com/jilavsky/pyirena-ai/tree/main/planning/ai-agent"
Repository    = "https://github.com/jilavsky/pyirena-ai"
Changelog     = "https://github.com/jilavsky/pyirena-ai/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/jilavsky/pyirena-ai/issues"
Upstream      = "https://github.com/jilavsky/pyirena"

[project.scripts]
pyirena-ai = "pyirena_ai.cli.main:main"

[tool.setuptools.packages.find]
include = ["pyirena_ai*"]

[tool.setuptools.package-data]
pyirena_ai = ["config/strategies/*.md"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "requires_pyirena_testdata: skip when pyirena's testData/ folder isn't reachable",
    "requires_llm: skip unless a real LLM API key is available (manual smoke tests)",
]
